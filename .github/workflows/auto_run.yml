name: Dynamic US Countdown Auto Updater

on:
  schedule:
    # US/Eastern Time ke hisab se roz raat ko 12:05 AM (Midnight) par automatic chalega (4:05 AM UTC)
    - cron: '5 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install requests

    - name: Execute AI Script
      env:
        AI_API_KEY: ${{ secrets.AI_API_KEY }}
      run: python update_shows.py

    - name: Push Updates to Repo
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add shows.json
        git diff-index --quiet HEAD || git commit -m "AI US Update: Refreshed US Trending Cards"
        git push
