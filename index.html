<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Google Discover & SEO Meta -->
    <title>Upcoming Hollywood Movies 2026 | US Streaming Charts</title>
    <meta name="description" content="Official US release countdowns for 2026's biggest Hollywood movies.">
    <meta property="og:image" content="maxresdefault.webp">
    <meta property="og:image:secure_url" content="hbo-discover.webp">
    <meta property="og:type" content="website">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --timer-bg: #070a12;
            --neon-green: #22c55e;
            --neon-glow: rgba(34, 197, 94, 0.3);
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 15px;
            overflow-x: hidden;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; padding: 15px 0; }
        h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
        .seo-text { color: #94a3b8; font-size: 0.9rem; }
        
        section { margin-bottom: 30px; }
        h2 { font-size: 1.1rem; margin-bottom: 20px; color: var(--accent); text-transform: uppercase; letter-spacing: 1.2px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        
        .grid-countdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .discover-only-img { display: none !important; }

        .card { 
            background: var(--card-bg); 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .platform-tag { 
            align-self: flex-start;
            background: rgba(56, 189, 248, 0.1); 
            color: var(--accent); 
            padding: 4px 10px; 
            font-size: 0.65rem; 
            font-weight: 800; 
            border-radius: 4px; 
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .card-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; color: #fff; }
        .card-desc { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; flex-grow: 1; }
        
        /* 🚀 SINGLE PREMIUM CLOCK - MOBILE PERFECT */
        .premium-timer-box {
            background: var(--timer-bg);
            border-radius: 12px;
            padding: 15px 5px;
            border: 1px solid #1e293b;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .clock-digits-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
        .time-segment { text-align: center; flex: 1; max-width: 55px; }
        .time-number {
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-glow);
            background: rgba(34, 197, 94, 0.05);
            padding: 8px 0;
            border-radius: 6px;
            border: 1px solid rgba(34, 197, 94, 0.1);
            display: block;
            width: 100%;
        }
        .time-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; margin-top: 5px; font-weight: 700; }
        .clock-colon { font-size: 1.3rem; font-weight: 900; color: rgba(34, 197, 94, 0.3); margin-top: -15px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Reactions */
        .reaction-container { display: flex; gap: 10px; padding-top: 18px; border-top: 1px solid var(--border); }
        .reaction-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); color: #94a3b8; padding: 7px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 5px; flex: 1; justify-content: center; transition: 0.2s; }
        .reaction-btn.active { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: #fff; }
        .reaction-count { font-weight: 700; }

        @media (max-width: 360px) {
            .time-number { font-size: 1.2rem; padding: 6px 0; }
            .clock-colon { font-size: 1rem; margin-top: -12px; }
        }
    </style>
</head>
<body>

    <img src="maxresdefault.webp" class="discover-only-img" alt="Hollywood 2026">
    <img src="hbo-discover.webp" class="discover-only-img" alt="US Streaming">

    <div class="container">
        <header>
            <h1 id="seo-title">Hollywood Movie Countdown 2026</h1>
            <p class="seo-text">Official US Release Trackers & Live Schedules.</p>
        </header>

        <section>
            <h2>Upcoming US Premieres</h2>
            <div class="grid-countdown" id="countdown-container"></div>
        </section>
    </div>

    <script>
        function startTimer(targetDateStr, index) {
            function update() {
                const diff = new Date(targetDateStr).getTime() - new Date().getTime();
                const wrapper = document.getElementById(`wrapper-${index}`);

                if (diff <= 0) {
                    if (wrapper) wrapper.innerHTML = "<div style='color:var(--neon-green);font-weight:900;font-size:1.1rem;text-shadow:0 0 10px var(--neon-glow);'>AVAILABLE NOW</div>";
                    return;
                }

                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff % 86400000) / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);

                document.getElementById(`d-${index}`).innerText = String(d).padStart(2, '0');
                document.getElementById(`h-${index}`).innerText = String(h).padStart(2, '0');
                document.getElementById(`m-${index}`).innerText = String(m).padStart(2, '0');
                document.getElementById(`s-${index}`).innerText = String(s).padStart(2, '0');
            }
            setInterval(update, 1000); update();
        }

        function handleReaction(showKey, type, btn) {
            const sKey = `react-${showKey}-${type}`;
            let count = parseInt(localStorage.getItem(sKey+'-count') || Math.floor(Math.random()*40)+15);
            if (btn.classList.contains('active')) {
                btn.classList.remove('active'); count--; localStorage.setItem(sKey, 'false');
            } else {
                btn.classList.add('active'); count++; localStorage.setItem(sKey, 'true');
            }
            localStorage.setItem(sKey+'-count', count);
            document.getElementById(`count-${showKey}-${type}`).innerText = count;
        }

        async function init() {
            const res = await fetch('shows.json?t=' + Date.now());
            const data = await res.json();
            const container = document.getElementById('countdown-container');
            
            data.upcoming_countdowns.forEach((item, i) => {
                const showKey = item.title.replace(/\s+/g, '-').toLowerCase();
                const types = ['fire', 'heart', 'hype'];
                const counts = types.map(t => {
                    if(!localStorage.getItem(`react-${showKey}-${t}-count`)) 
                        localStorage.setItem(`react-${showKey}-${t}-count`, Math.floor(Math.random()*50)+20);
                    return localStorage.getItem(`react-${showKey}-${t}-count`);
                });

                container.innerHTML += `
                    <div class="card">
                        <span class="platform-tag">${item.platform}</span>
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-desc">${item.description}</p>
                        
                        <div class="premium-timer-box">
                            <div class="clock-digits-wrapper" id="wrapper-${i}">
                                <div class="time-segment"><span class="time-number" id="d-${i}">00</span><div class="time-label">Days</div></div>
                                <div class="clock-colon">:</div>
                                <div class="time-segment"><span class="time-number" id="h-${i}">00</span><div class="time-label">Hours</div></div>
                                <div class="clock-colon">:</div>
                                <div class="time-segment"><span class="time-number" id="m-${i}">00</span><div class="time-label">Mins</div></div>
                                <div class="clock-colon">:</div>
                                <div class="time-segment"><span class="time-number" id="s-${i}">00</span><div class="time-label">Secs</div></div>
                            </div>
                        </div>

                        <div class="reaction-container">
                            ${types.map((t, idx) => `
                                <button class="reaction-btn ${localStorage.getItem(`react-${showKey}-${t}`)=='true'?'active':''}" onclick="handleReaction('${showKey}','${t}',this)">
                                    ${t=='fire'?'🔥':t=='heart'?'❤️':'😮'} <span id="count-${showKey}-${t}">${counts[idx]}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
                startTimer(item.countdown_date, i);
            });
        }
        window.onload = init;
    </script>
</body>
</html>
