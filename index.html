<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Discover / SEO Meta Tags (Photos only for Google) -->
    <title>Upcoming Hollywood Movies 2026 | US Streaming Charts</title>
    <meta name="description" content="Exclusive release dates and countdowns for the biggest Hollywood movies and web series coming in 2026.">
    <meta property="og:image" content="maxresdefault.webp">
    <meta property="og:image:secure_url" content="hbo-discover.webp">
    <meta property="og:type" content="website">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-green: #22c55e;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            line-height: 1.5;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; padding: 20px 0; }
        h1 { font-size: 2.2rem; color: var(--text-main); margin-bottom: 10px; font-weight: 800; }
        p.seo-text { color: var(--text-muted); font-size: 1.1rem; max-width: 700px; margin: 0 auto; }
        
        section { margin-bottom: 40px; }
        h2 { font-size: 1.4rem; margin-bottom: 20px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        /* Grid Layouts */
        .grid-countdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        
        /* Hidden Class for Discover Images */
        .discover-only-img { display: none !important; }

        /* Cards styling - No Images */
        .card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            padding: 24px;
            transition: 0.3s;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-3px); }
        
        .platform-tag { 
            display: inline-block;
            background: rgba(56, 189, 248, 0.1); 
            color: var(--accent); 
            padding: 4px 12px; 
            font-size: 0.7rem; 
            font-weight: 800; 
            border-radius: 4px; 
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        
        .card-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; color: #fff; }
        .card-desc { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px; }
        
        /* Countdown Timer */
        .timer-box { 
            background: rgba(15, 23, 42, 0.5); 
            border-radius: 8px; 
            padding: 15px; 
            text-align: center; 
            border: 1px dashed var(--border);
        }
        .timer-display { font-family: monospace; font-size: 1.5rem; font-weight: bold; color: var(--accent-green); }
        .release-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .timer-display { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- Hidden images for Google Discover to crawl -->
    <img src="maxresdefault.webp" class="discover-only-img" alt="Hollywood Upcoming Movies 2026">
    <img src="hbo-discover.webp" class="discover-only-img" alt="US Series Streaming Charts 2026">

    <div class="container">
        <header>
            <h1 id="seo-title">Hollywood Movie Countdown 2026</h1>
            <p class="seo-text" id="seo-text">Daily updated schedules for US streaming and theater releases.</p>
        </header>

        <section>
            <h2>US Premieres & Trackers</h2>
            <div class="grid-countdown" id="countdown-container">
                <!-- Data populated by JavaScript -->
            </div>
        </section>
    </div>

    <script>
        function startTimer(targetDateStr, elementId) {
            function updateClock() {
                const target = new Date(targetDateStr).getTime();
                const now = new Date().getTime();
                const diff = target - now;
                const el = document.getElementById(elementId);
                if (!el) return;

                if (diff <= 0) {
                    el.innerHTML = "AVAILABLE NOW";
                    el.style.color = "#22c55e";
                    return;
                }

                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                el.innerHTML = `${d}d ${h}h ${m}m ${s}s`;
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        async function loadData() {
            try {
                const res = await fetch('shows.json?t=' + Date.now());
                const data = await res.json();

                const container = document.getElementById('countdown-container');
                container.innerHTML = '';
                
                data.upcoming_countdowns.forEach((item, i) => {
                    const tId = `clock-${i}`;
                    container.innerHTML += `
                        <div class="card">
                            <span class="platform-tag">${item.platform}</span>
                            <h3 class="card-title">${item.title}</h3>
                            <p class="card-desc">${item.description}</p>
                            <div class="timer-box">
                                <div class="timer-display" id="${tId}">00d 00h 00m 00s</div>
                                <div class="release-label">Official Launch: ${item.release_date_text}</div>
                            </div>
                        </div>
                    `;
                    setTimeout(() => startTimer(item.countdown_date, tId), 50);
                });
            } catch (e) {
                document.getElementById('seo-title').innerText = "Syncing Hollywood Data...";
            }
        }
        window.onload = loadData;
    </script>
</body>
</html>
