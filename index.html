<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Upcoming Hollywood Movies 2026 | US Streaming Charts</title>
    <meta name="description" content="Exclusive release dates and countdowns for the biggest Hollywood movies and web series coming in 2026.">
    <meta property="og:image" content="maxresdefault.webp">
    <meta property="og:image:secure_url" content="hbo-discover.webp">
    <meta property="og:type" content="website">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --timer-bg: #070a12;
            --neon-green: #22c55e;
            --neon-glow: rgba(34, 197, 94, 0.3);
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            line-height: 1.5;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; padding: 30px 0; }
        h1 { font-size: 2.4rem; color: var(--text-main); margin-bottom: 12px; font-weight: 800; letter-spacing: -0.5px; }
        p.seo-text { color: #94a3b8; font-size: 1.1rem; max-width: 700px; margin: 0 auto; }
        
        section { margin-bottom: 40px; }
        h2 { font-size: 1.3rem; margin-bottom: 25px; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        
        .grid-countdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }
        .discover-only-img { display: none !important; }

        /* Premium Card Design */
        .card { 
            background: var(--card-bg); 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            padding: 26px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px -15px rgba(0,0,0,0.5);
        }
        .card:hover { 
            border-color: var(--accent); 
            transform: translateY(-5px);
            box-shadow: 0 15px 35px -10px var(--accent-glow);
        }
        
        .platform-tag { 
            display: inline-block;
            align-self: flex-start;
            background: rgba(56, 189, 248, 0.08); 
            color: var(--accent); 
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 4px 14px; 
            font-size: 0.7rem; 
            font-weight: 800; 
            border-radius: 6px; 
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .card-title { font-size: 1.45rem; font-weight: 800; margin-bottom: 10px; color: #fff; letter-spacing: -0.3px; }
        .card-desc { color: #94a3b8; font-size: 0.95rem; margin-bottom: 24px; flex-grow: 1; line-height: 1.6; }
        
        /* 🚀 PREMIUM DIGITAL CLOCK SYSTEM */
        .premium-timer {
            background: var(--timer-bg);
            border-radius: 12px;
            padding: 16px 10px;
            border: 1px solid #1e293b;
            margin-bottom: 22px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
        }
        .clock-digits-wrapper {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .time-segment {
            text-align: center;
            min-width: 55px;
        }
        .time-number {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 12px var(--neon-glow);
            background: rgba(34, 197, 94, 0.05);
            padding: 4px 0;
            border-radius: 6px;
            border: 1px solid rgba(34, 197, 94, 0.1);
            display: block;
        }
        .time-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }
        .clock-colon {
            font-size: 1.6rem;
            font-weight: 900;
            color: rgba(34, 197, 94, 0.4);
            align-self: center;
            margin-top: -18px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        .release-label { 
            font-size: 0.75rem; 
            color: #64748b; 
            text-align: center;
            margin-top: 12px;
            font-weight: 500;
        }

        /* Reactions Layout */
        .reaction-container { display: flex; gap: 10px; padding-top: 18px; border-top: 1px solid var(--border); }
        .reaction-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); color: #94a3b8; padding: 7px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s ease; }
        .reaction-btn:hover { background: rgba(255, 255, 255, 0.07); color: #fff; border-color: #475569; }
        .reaction-btn.active { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: #fff; text-shadow: 0 0 8px rgba(56, 189, 248, 0.5); }
        .reaction-count { font-weight: 700; font-size: 0.8rem; }

        @media (max-width: 600px) {
            h1 { font-size: 1.9rem; }
            .time-number { font-size: 1.4rem; min-width: 45px; }
        }
    </style>
</head>
<body>

    <img src="maxresdefault.webp" class="discover-only-img" alt="Hollywood Upcoming Movies 2026">
    <img src="hbo-discover.webp" class="discover-only-img" alt="US Series Streaming Charts 2026">

    <div class="container">
        <header>
            <h1 id="seo-title">Hollywood Movie Countdown 2026</h1>
            <p class="seo-text" id="seo-text">Daily updated schedules for US streaming and theater releases.</p>
        </header>

        <section>
            <h2>US Premieres & Trackers</h2>
            <div class="grid-countdown" id="countdown-container">
                </div>
        </section>
    </div>

    <script>
        function startTimer(targetDateStr, index) {
            function updateClock() {
                const target = new Date(targetDateStr).getTime();
                const now = new Date().getTime();
                const diff = target - now;

                const dEl = document.getElementById(`d-${index}`);
                const hEl = document.getElementById(`h-${index}`);
                const mEl = document.getElementById(`m-${index}`);
                const sEl = document.getElementById(`s-${index}`);
                const wrapper = document.getElementById(`wrapper-${index}`);

                if (!dEl) return;

                if (diff <= 0) {
                    wrapper.innerHTML = `<div style="color: var(--neon-green); font-weight:900; font-family:monospace; font-size:1.4rem; text-shadow: 0 0 10px var(--neon-glow); letter-spacing:1px;">⚡ AVAILABLE NOW STREAMING</div>`;
                    return;
                }

                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                // Pad numbers with leading zeros for premium digital display look
                dEl.innerText = d < 10 ? '0' + d : d;
                hEl.innerText = h < 10 ? '0' + h : h;
                mEl.innerText = m < 10 ? '0' + m : m;
                sEl.innerText = s < 10 ? '0' + s : s;
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        function handleReaction(showKey, type, btn) {
            const storageKey = `react-${showKey}-${type}`;
            let countId = `count-${showKey}-${type}`;
            let currentCount = parseInt(localStorage.getItem(storageKey + '-count') || Math.floor(Math.random() * 40) + 10);

            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                currentCount--;
                localStorage.setItem(storageKey, 'false');
            } else {
                btn.classList.add('active');
                currentCount++;
                localStorage.setItem(storageKey, 'true');
            }

            localStorage.setItem(storageKey + '-count', currentCount);
            document.getElementById(countId).innerText = currentCount;
        }

        function initReactions(showKey, type) {
            const storageKey = `react-${showKey}-${type}`;
            if (!localStorage.getItem(storageKey + '-count')) {
                localStorage.setItem(storageKey + '-count', Math.floor(Math.random() * 60) + 15);
            }
            return localStorage.getItem(storageKey + '-count');
        }

        async function loadData() {
            try {
                const res = await fetch('shows.json?t=' + Date.now());
                const data = await res.json();

                const container = document.getElementById('countdown-container');
                container.innerHTML = '';
                
                data.upcoming_countdowns.forEach((item, i) => {
                    const showKey = item.title.replace(/\s+/g, '-').toLowerCase();
                    
                    const fireCount = initReactions(showKey, 'fire');
                    const heartCount = initReactions(showKey, 'heart');
                    const hypeCount = initReactions(showKey, 'hype');

                    const isFire = localStorage.getItem(`react-${showKey}-fire`) === 'true' ? 'active' : '';
                    const isHeart = localStorage.getItem(`react-${showKey}-heart`) === 'true' ? 'active' : '';
                    const isHype = localStorage.getItem(`react-${showKey}-hype`) === 'true' ? 'active' : '';

                    container.innerHTML += `
                        <div class="card">
                            <span class="platform-tag">${item.platform}</span>
                            <h3 class="card-title">${item.title}</h3>
                            <p class="card-desc">${item.description}</p>
                            
                            <div class="premium-timer">
                                <div class="clock-digits-wrapper" id="wrapper-${i}">
                                    <div class="time-segment"><span class="time-number" id="d-${i}">00</span><div class="time-label">Days</div></div>
                                    <div class="clock-colon">:</div>
                                    <div class="time-segment"><span class="time-number" id="h-${i}">00</span><div class="time-label">Hours</div></div>
                                    <div class="clock-colon">:</div>
                                    <div class="time-segment"><span class="time-number" id="m-${i}">00</span><div class="time-label">Mins</div></div>
                                    <div class="clock-colon">:</div>
                                    <div class="time-segment"><span class="time-number" id="s-${i}">00</span><div class="time-label">Secs</div></div>
                                </div>
                                <div class="release-label">Target Release: ${item.release_date_text}</div>
                            </div>

                            <div class="reaction-container">
                                <button class="reaction-btn ${isFire}" onclick="handleReaction('${showKey}', 'fire', this)">
                                    🔥 <span class="reaction-count" id="count-${showKey}-fire">${fireCount}</span>
                                </button>
                                <button class="reaction-btn ${isHeart}" onclick="handleReaction('${showKey}', 'heart', this)">
                                    ❤️ <span class="reaction-count" id="count-${showKey}-heart">${heartCount}</span>
                                </button>
                                <button class="reaction-btn ${isHype}" onclick="handleReaction('${showKey}', 'hype', this)">
                                    😮 <span class="reaction-count" id="count-${showKey}-hype">${hypeCount}</span>
                                </button>
                            </div>
                        </div>
                    `;
                    setTimeout(() => startTimer(item.countdown_date, i), 50);
                });
            } catch (e) {
                document.getElementById('seo-title').innerText = "Syncing Hollywood Data...";
            }
        }
        window.onload = loadData;
    </script>
</body>
</html>
