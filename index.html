<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest US TV Series & Movies Countdown - Live Release Timers</title>
    <meta name="description" content="Track upcoming Hollywood movies and US web series release dates. Live countdown timers for the most anticipated shows on Netflix US, HBO Max, and Hulu.">
    <meta name="google-site-verification" content="5xE_ljStcPCLEZ_ZXLqMUyp3Z1UHxlQYot3v4jtuPOY" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0b0f19; 
            --card-bg: rgba(22, 29, 49, 0.7); 
            --accent: #38bdf8; 
            --accent-glow: rgba(56, 189, 248, 0.15);
            --text-main: #f1f5f9; 
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.06);
            
            /* US Brand Platforms Colors */
            --netflix: #e50914;
            --hbo: #9933ff;
            --hulu: #1ce783;
            --prime: #00a8e1;
            --theaters: #eab308;
        }
        
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            padding: 40px 20px; 
            text-align: center; 
            -webkit-font-smoothing: antialiased;
            background-image: radial-gradient(circle at 50% -20%, rgba(56, 189, 248, 0.12), transparent 50%);
        }

        .wrapper { max-width: 1050px; margin: 0 auto; }
        
        .header { margin: 40px 0 60px 0; }
        .header h1 { 
            font-size: 3rem; 
            font-weight: 800; 
            letter-spacing: -1.5px; 
            margin-bottom: 12px; 
            background: linear-gradient(135deg, #ffffff 40%, #a5f3fc 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .header p { color: var(--text-muted); font-size: 1.15rem; font-weight: 400; max-width: 600px; margin: 0 auto; line-height: 1.5; }

        .section-title {
            text-align: left;
            font-size: 1.75rem;
            font-weight: 700;
            margin: 60px 0 20px 0;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 60%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 30px; 
        }

        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px; 
            padding: 32px; 
            text-align: left; 
            border: 1px solid var(--border); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        .card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 30px 60px rgba(255, 255, 255, 0.02);
        }

        /* Dynamic Border Glows based on Platforms */
        .card.netflix:hover { border-color: rgba(229, 9, 20, 0.4); }
        .card.hbo:hover { border-color: rgba(153, 51, 255, 0.4); }
        .card.hulu:hover { border-color: rgba(28, 231, 131, 0.4); }
        .card.prime:hover { border-color: rgba(0, 168, 225, 0.4); }
        .card.theaters:hover { border-color: rgba(234, 179, 8, 0.4); }

        .card h2 { margin: 0 0 12px 0; font-size: 1.55rem; color: #fff; font-weight: 700; letter-spacing: -0.5px; }
        
        .badge { 
            display: inline-block; 
            padding: 6px 14px; 
            border-radius: 100px; 
            font-size: 0.78rem; 
            font-weight: 600; 
            margin-bottom: 20px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        /* Badge Platform colors */
        .netflix .badge { color: var(--netflix); border-color: rgba(229, 9, 20, 0.2); background: rgba(229, 9, 20, 0.05); }
        .hbo .badge { color: var(--hbo); border-color: rgba(153, 51, 255, 0.2); background: rgba(153, 51, 255, 0.05); }
        .hulu .badge { color: var(--hulu); border-color: rgba(28, 231, 131, 0.2); background: rgba(28, 231, 131, 0.05); }
        .prime .badge { color: var(--prime); border-color: rgba(0, 168, 225, 0.2); background: rgba(0, 168, 225, 0.05); }
        .theaters .badge { color: var(--theaters); border-color: rgba(234, 179, 8, 0.2); background: rgba(234, 179, 8, 0.05); }

        .timer { 
            display: flex; 
            justify-content: space-between; 
            background: rgba(9, 13, 22, 0.6); 
            padding: 16px; 
            border-radius: 16px; 
            margin: 24px 0; 
            border: 1px solid var(--border); 
        }
        .t-block { text-align: center; flex: 1; position: relative; }
        .t-block:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 25%;
            height: 50%;
            width: 1px;
            background: rgba(255, 255, 255, 0.08);
        }
        .t-block span { display: block; font-size: 1.9rem; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
        .t-block label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; margin-top: 2px; display: block; }

        .desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin: 0; font-weight: 400; }
        
        /* Trending Style Elements */
        .rank-tag {
            float: right;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .netflix .rank-tag { color: var(--netflix); }
        .hbo .rank-tag { color: var(--hbo); }
        .hulu .rank-tag { color: var(--hulu); }
        .prime .rank-tag { color: var(--prime); }

        .seo-section { 
            text-align: left; 
            margin-top: 80px; 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px; 
            border-radius: 24px; 
            border: 1px solid var(--border); 
            color: var(--text-muted); 
            font-size: 1rem; 
            line-height: 1.7; 
        }
        .seo-section h3 { color: #fff; font-size: 1.4rem; margin-top: 0; font-weight: 700; letter-spacing: -0.5px; }

        .loading { font-size: 1.2rem; color: var(--text-muted); padding: 40px; text-align: center; width: 100%; grid-column: 1/-1; }
    </style>
</head>
<body>

    <!-- Google Discover Image Injector (Strictly Hidden from Users) -->
<div style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;" id="discover-hidden-images">
    <img src="maxresdefault.webp" alt="Best Upcoming 2026 Movies Hollywood Countdowns" width="1200" height="675">
    <img src="hbo-discover.webp" alt="House of the Dragon Season 3 Live Release Countdown US" width="1200" height="675">
</div>
    
    <div class="wrapper">
        <div class="header">
            <h1>US Streaming Countdown</h1>
            <p>Real-time aesthetic countdowns and charts for major US platforms including Netflix, HBO Max, Hulu, and Prime Video.</p>
        </div>

        <!-- Section 1: Countdowns -->
        <div class="section-title">🇺🇸 Anticipated US Premieres</div>
        <div class="grid" id="shows-grid">
            <div class="loading">Loading upcoming US premieres...</div>
        </div>

        <!-- Section 2: Now Trending -->
        <div class="section-title">🔥 What Americans Are Watching Right Now</div>
        <div class="grid" id="trending-grid">
            <div class="loading">Loading live US streaming charts...</div>
        </div>

        <!-- SEO Section -->
        <div class="seo-section" id="seo-content">
            <!-- Dynamic SEO Text -->
        </div>
    </div>

    <script>
        fetch('shows.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                // Helper to get platform CSS class names
                const getPlatformClass = (platformStr) => {
                    const p = platformStr.toLowerCase();
                    if(p.includes('netflix')) return 'netflix';
                    if(p.includes('hbo') || p.includes('max')) return 'hbo';
                    if(p.includes('hulu')) return 'hulu';
                    if(p.includes('prime') || p.includes('amazon')) return 'prime';
                    if(p.includes('theater')) return 'theaters';
                    return '';
                };

                // 1. Render Upcoming Countdowns
                const grid = document.getElementById('shows-grid');
                grid.innerHTML = ''; 
                
                // Support both old structure data.shows or new structure data.upcoming_countdowns
                const countdownList = data.upcoming_countdowns || data.shows || [];
                
                if(countdownList.length === 0) {
                    grid.innerHTML = '<div class="loading">No upcoming shows found.</div>';
                }

                countdownList.forEach((show, index) => {
                    const idPrefix = `show-${index}`;
                    const card = document.createElement('div');
                    const platformClass = getPlatformClass(show.platform);
                    card.className = `card ${platformClass}`;
                    card.innerHTML = `
                        <span class="badge">${show.platform} • ${show.release_date_text}</span>
                        <h2>${show.title}</h2>
                        <div class="timer">
                            <div class="t-block"><span id="${idPrefix}-d">00</span><label>Days</label></div>
                            <div class="t-block"><span id="${idPrefix}-h">00</span><label>Hrs</label></div>
                            <div class="t-block"><span id="${idPrefix}-m">00</span><label>Min</label></div>
                            <div class="t-block"><span id="${idPrefix}-s">00</span><label>Sec</label></div>
                        </div>
                        <p class="desc">${show.description}</p>
                    `;
                    grid.appendChild(card);
                    setupTimer(show.countdown_date, idPrefix);
                });

                // 2. Render Multi-Platform Live Trending List
                const trendingGrid = document.getElementById('trending-grid');
                trendingGrid.innerHTML = '';

                if(data.now_trending && data.now_trending.length > 0) {
                    data.now_trending.forEach((item) => {
                        const card = document.createElement('div');
                        const platformClass = getPlatformClass(item.platform);
                        card.className = `card ${platformClass}`;
                        card.innerHTML = `
                            <div>
                                <span class="rank-tag">${item.rank || '#1 Trending'}</span>
                                <span class="badge">${item.platform}</span>
                            </div>
                            <h2>${item.title}</h2>
                            <p class="desc">${item.trending_reason}</p>
                        `;
                        trendingGrid.appendChild(card);
                    });
                } else {
                    trendingGrid.innerHTML = '<div class="loading">Trending charts update scheduled tonight.</div>';
                }

                // 3. Render SEO Paragraphs
                document.getElementById('seo-content').innerHTML = `<h3>${data.seo_title}</h3><p>${data.seo_text}</p>`;
            }).catch(err => {
                document.getElementById('shows-grid').innerHTML = '<div class="loading">Failed to load timers. Please refresh.</div>';
                document.getElementById('trending-grid').innerHTML = '<div class="loading">Failed to load charts.</div>';
            });

        function setupTimer(dateStr, idPrefix) {
            const target = new Date(dateStr).getTime();
            const timerInterval = setInterval(() => {
                const now = new Date().getTime();
                const diff = target - now;
                
                const dEl = document.getElementById(idPrefix + '-d');
                if(!dEl) { clearInterval(timerInterval); return; } // Break loop if elements removed

                if(diff < 0) {
                    document.getElementById(idPrefix + '-d').innerText = '00';
                    document.getElementById(idPrefix + '-h').innerText = '00';
                    document.getElementById(idPrefix + '-m').innerText = '00';
                    document.getElementById(idPrefix + '-s').innerText = '00';
                    clearInterval(timerInterval);
                    return;
                }

                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById(idPrefix + '-d').innerText = d < 10 ? '0'+d : d;
                document.getElementById(idPrefix + '-h').innerText = h < 10 ? '0'+h : h;
                document.getElementById(idPrefix + '-m').innerText = m < 10 ? '0'+m : m;
                document.getElementById(idPrefix + '-s').innerText = s < 10 ? '0'+s : s;
            }, 1000);
        }
    </script>
</body>
</html>
